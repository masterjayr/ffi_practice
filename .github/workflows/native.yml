name: Native Build (iOS)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Select Xcode 26.0.1
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake ninja

      - name: Build iOS native framework
        env:
          OPENCV_ZIP_URL: https://github.com/masterjayr/ffi_practice/releases/download/v12.0/opencv2.framework.zip
        run: |
          chmod +x scripts/build_ios.sh
          scripts/build_ios.sh

      - name: Upload xcframework artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffi_practice_native_ios
          path: ios/Frameworks/ffi_practice_native.xcframework

  android-native:
    name: Build Android native libs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager "ndk;29.0.13599879"

      - name: Export ANDROID_NDK_HOME
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.13599879" >> $GITHUB_ENV

      - name: Make scripts executable
        run: |
          chmod +x scripts/build_android.sh

      - name: Build Android native libraries
        run: |
          scripts/build_android.sh

      - name: Verify outputs
        run: |
          ls -R android/src/main/jniLibs

      - name: Commit native Android binaries
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add android/src/main/jniLibs
          git commit -m "chore(android): update native binaries" || echo "No changes"
          git push
